<h2><a name="pdf">ＰＤＦファイルについて</a></h2>

<br>
　ＰＤＦファイルは、ホームページ上で見るよりも、より見やすい形になっています。<br>
　特に、印刷する場合には、こちらを使用されることをおすすめします。


<br>
　ＰＤＦファイルはダウンロードして閲覧することも可能です。<br>
　リンクを右クリックして、メニューから「対象をファイルに保存」や「リンクを名前を付けて保存」を選択してください。


<br>
　ＰＤＦ形式のファイルを見るには Adobe Acrobat Reader(R) が必要です。<br>
　Acrobat Reader(R) をお持ちでない方は、<a href="http://www.adobe.co.jp/products/acrobat/readstep2.html" target="_blank">こちら</a>からダウンロードしてください。
