<h2>リンク</h2>
<!-- BEGIN sb_link_message -->
<h3>処理通知</h3>
<p class="result">{sb_process_message}</p>
<!-- END sb_link_message -->
<!-- BEGIN sb_link_newsite -->
<h3>新規リンクの追加</h3>
<!-- END sb_link_newsite -->
<!-- BEGIN sb_link_oldsite -->
<h3><a href="{sb_site_cgi}?__mode=link">[root]</a> &gt; {sb_link_navi}</h3>
<!-- END sb_link_oldsite -->
<form action="{sb_site_cgi}" name="mainform" method="post" enctype="multipart/form-data">
<dl class="subform" id="link_site">
<dt><label accesskey="n" for="link_name">サイト名<span>[N]</span></label></dt>
<dd><input type="text" name="link_name" id="link_name" value="{sb_link_sitename}" size="50" class="text" /></dd>
<dt><label accesskey="u" for="link_url">URI<span>[U]</span></label></dt>
<dd><input type="text" name="link_url" id="link_url" value="{sb_link_siteurl}" size="50" class="text" /></dd>
<dt><label accesskey="t" for="link_text">説明<span>[T]</span></label></dt>
<dd><input type="text" name="link_text" id="link_text" value="{sb_link_sitetext}" size="50" class="text" /></dd>
<dt><label accesskey="t" for="link_target">target属性<span>[R]</span></label></dt>
<dd><input type="text" name="link_target" id="link_target" value="{sb_link_sitetarget}" size="20" class="text" /></dd>
<dt><label accesskey="g" for="link_type">グループ<span>[G]</span></label></dt>
<dd><select name="link_type" id="link_type"><option value="">指定しない</option>{sb_link_typesel}</select></dd>
<dt class="submit">追加/編集</dt>
<dd class="submit">
<input type="hidden" name="__mode" value="link" />
<input type="hidden" name="__regi" value="site" />
<input type="hidden" name="charset" value="{sb_site_encoding}" />
<!-- BEGIN sb_link_newsite -->
<input type="submit" name="new" value="&gt; 追加する &lt;" class="button" />
<!-- END sb_link_newsite -->
<!-- BEGIN sb_link_oldsite -->
<input type="hidden" name="lid" value="{sb_link_siteid}" />
<input type="submit" name="edit" value="&gt; 更新する &lt;" class="button" />
<!-- END sb_link_oldsite -->
</dd>
</dl>
</form>
<!-- BEGIN sb_link_group -->
<!-- BEGIN sb_link_newgroup -->
<h3>新規グループの追加</h3>
<!-- END sb_link_newgroup -->
<!-- BEGIN sb_link_oldgroup -->
<h3><a href="{sb_site_cgi}?__mode=link">[root]</a> &gt; {sb_link_navi}</h3>
<!-- END sb_link_oldgroup -->
<!-- BEGIN sb_link_group_edit -->
<form action="{sb_site_cgi}" name="mainform" method="post" enctype="multipart/form-data">
<dl class="subform" id="link_group">
<dt><label accesskey="A" for="link_group_name">グループ名<span>[A]</span></label></dt>
<dd><input type="text" name="link_group_name" id="link_group_name" value="{sb_link_groupname}" size="50" class="text" /></dd>
<dt><label accesskey="E" for="link_group_text">説明<span>[E]</span></label></dt>
<dd><input type="text" name="link_group_text" id="link_group_text" value="{sb_link_grouptext}" size="50" class="text" /></dd>
<dt class="submit">追加/編集</dt>
<dd class="submit">
<input type="hidden" name="__mode" value="link" />
<input type="hidden" name="__regi" value="group" />
<input type="hidden" name="charset" value="{sb_site_encoding}" />
<!-- BEGIN sb_link_newgroup -->
<input type="submit" name="new" value="&gt; 追加する &lt;" class="button" />
<!-- END sb_link_newgroup -->
<!-- BEGIN sb_link_oldgroup_button -->
<input type="hidden" name="lid" value="{sb_link_groupid}" />
<input type="submit" name="edit" value="&gt; 更新する &lt;" class="button" />
<!-- END sb_link_oldgroup_button -->
</dd>
</dl>
</form>
<!-- END sb_link_group_edit -->
<table cellpadding="0" cellspacing="1" class="list">
{sb_list_page}
<form action="{sb_site_cgi}" method="post" enctype="multipart/form-data" name="listform">
<tr class="lead">
<th>ID</th>
<th>編集</th>
<th>サイト</th>
<th>状態</th>
<th colspan="2">順番</th>
<th><input type="checkbox" name="selectAll" id="selectAll" onclick="switchAll(this);" /></th>
</tr>
<!-- BEGIN sb_link_list -->
<tr class="{sb_list_class}">
<td>{sb_link_id}</td>
<td>{sb_link_edit}</td>
<td class="elem">{sb_link_name}<input type="hidden" name="sel_id" value="{sb_link_id}" /></td>
<td>{sb_link_dispstat}</td>
<td>{sb_link_order}</td>
<td><span class="disp{sb_link_disp}_">{sb_link_sel}</span></td>
</tr>
<!-- END sb_link_list -->
<tr class="tool"><td colspan="7">
[選択 : <span id="showSelected">0</span>]
<select name="typeselect" onchange="selectType(this.value);">
<option value="">リンク選択</option>
<option value="">&#x25BC;[ステータス] ────</option>
<option value="disp0_">公開</option>
<option value="disp1_">非公開</option>
</select>
<input type="button" value="全選択" onclick="selectAllList()" />
<input type="button" value="解除" onclick="clearAllList()" />
</td></tr>
<tr class="tool"><td colspan="7">
<input type="hidden" name="charset" value="{sb_site_encoding}" />
<input type="hidden" name="page" value="{page_now}" />
<input type="hidden" name="lid" value="{sb_link_groupid}" />
<input type="hidden" name="__mode" value="link" />
<input type="hidden" name="__regi" value="update" />
<label for="regi_action">選択項目について：</label>
<select name="regi_action" id="regi_action">
<option value="">処理内容選択</option>
<option value="">&#x25BC;[リンク削除] ─────</option>
<option value="del">削除する</option>
<option value="">&#x25BC;[表示設定] ────</option>
<option value="disp0">表示する</option>
<option value="disp1">表示しない</option>
<option value="">&#x25BC;[グループ変更] ────</option>
<option value="group">指定しない</option>
{sb_link_typechange}
</select>
<input type="submit" name="action" value="&gt; 実行 &lt;" onclick="return confirmAction();" class="button" />
</td></tr>
</form>
{sb_list_page}
</table>
<form action="{sb_site_cgi}" id="dispset" class="list_tool" method="post" enctype="multipart/form-data">
<table class="list" cellpadding="0" cellspacing="1">
<tr class="odd">
<th class="head">表示数：</th>
<td class="elem"><select name="dispnum">{sb_dispnum_option}</select></td>
<td><input type="hidden" name="__mode" value="link" /><input type="submit" name="submit" value="表示" class="button" /></td>
</tr>
</table>
</form>
<!-- END sb_link_group -->
