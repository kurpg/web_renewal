<h2>ユーザー管理</h2>
<!-- BEGIN sb_user_message -->
<h3>処理通知</h3>
<p class="result">{sb_process_message}</p>
<!-- END sb_user_message -->
<form action="{sb_site_cgi}" name="mainform" method="post" enctype="multipart/form-data">
<h3>新規ユーザー</h3>
<dl class="subform">
<dt><label accesskey="u" for="user_name">ユーザー名<span>[U]</span></label></dt>
<dd><input type="text" name="user_name" id="user_name" value="{sb_user_name}" size="20" class="text" /></dd>
<dt><label accesskey="r" for="user_real">フルネーム<span>[R]</span></label></dt>
<dd><input type="text" name="user_real" id="user_real" value="{sb_user_real}" size="40" class="text" /></dd>
<dt><label accesskey="p" for="user_pass">パスワード<span>[P]</span></label></dt>
<dd><input type="password" name="user_pass" id="user_pass" value="" size="8" maxlength="8" class="text" /></dd>
<dt><label accesskey="c" for="user_passconf">パスワード確認<span>[C]</span></label></dt>
<dd><input type="password" name="user_passconf" id="user_passconf" value="" size="8" maxlength="8" class="text" /></dd>
<dt><label accesskey="m" for="user_mail">メールアドレス<span>[M]</span></label></dt>
<dd><input type="text" name="user_mail" id="user_mail" value="{sb_user_mail}" size="40" class="text" /></dd>
<dt><label accesskey="l" for="user_stat">ユーザー権限<span>[L]</span></label></dt>
<dd><select name="user_stat" id="user_stat"><option value="2">一般ユーザー</option><option value="1">上級ユーザー</option></select></dd>
<dt class="submit">追加</dt>
<dd class="submit">
<input type="hidden" name="__mode" value="user" />
<input type="hidden" name="__regi" value="add" />
<input type="hidden" name="charset" value="{sb_site_encoding}" />
<input type="submit" name="add" value="&gt; 追加する &lt;" class="button" />
</dd>
</dl>
</form>
<table cellpadding="0" cellspacing="1" class="list">
{sb_list_page}
<form action="{sb_site_cgi}" method="post" enctype="multipart/form-data" name="listform">
<tr class="lead">
<th>ID</th>
<th>編集</th>
<th>ユーザー名</th>
<th>フルネーム</th>
<th>メールアドレス</th>
<th colspan="2">順番</th>
<th><input type="checkbox" name="selectAll" id="selectAll" onclick="switchAll(this);" /></th>
</tr>
<!-- BEGIN sb_user_list -->
<tr class="{sb_list_class}">
<td>{sb_userlist_id}</td>
<td><a href="{sb_site_cgi}?__mode=edituser&amp;pid={sb_userlist_id}">編集</a></td>
<td class="elem">{sb_userlist_name}{sb_userlist_stat}</td>
<td class="elem">{sb_userlist_real}</td>
<td class="elem">{sb_userlist_mail}</td>
<td>{sb_userlist_order}</td>
<td><span>{sb_userlist_del}<input type="hidden" name="sel_id" value="{sb_userlist_id}" /></span></td>
</tr>
<!-- END sb_user_list -->
<tr class="tool"><td colspan="8">
<input type="hidden" name="__mode" value="user" />
<input type="hidden" name="__regi" value="update" />
<input type="submit" name="del" value="選択ユーザー削除" onclick="return confirmDelete();" class="button" />
</td></tr>
</form>
{sb_list_page}
</table>
<form action="{sb_site_cgi}" id="dispset" class="list_tool" method="post" enctype="multipart/form-data">
<table class="list" cellpadding="0" cellspacing="1">
<tr class="odd">
<th class="head">表示数：</th>
<td class="elem"><select name="dispnum">{sb_dispnum_option}</select></td>
<td><input type="hidden" name="__mode" value="user" /><input type="submit" name="submit" value="表示" class="button" /></td>
</tr>
</table>
</form>
