		<h3><a name="word"></a>城の語義</h3>

<p>
　城は防御建築物です。土塁、堀、防壁を利用した高い位置、または水に囲まれた位置にある安全地帯という意味を持った城は、ヨーロッパ、および西南アジアの文化圏のほとんどすべての古い民族に知られています。
</p>
		<p>
　たとえばドイツ語で、城（ブルクBurg）とは「囲んで守る場所」。<br>
　市民の語源である「ビュルガー」（Burger）は、ブルクの住人という意味です。これをフランス語でいうと「ブルジョア」となります。
<br>
